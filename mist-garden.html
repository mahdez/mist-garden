<style>
/* Layout: a farm stand. The pixel field sits beside (wide) or above (narrow) wooden signboards holding status and choices. Lilac is reserved for the meteor mist. */
:root{
  --soil:#1b130d; --plank:#463222; --plank2:#2f2116; --edge:#c9a673; --groove:#6d4f33;
  --ink:#f6ecd8; --dim:#c9b797; --sprout:#a4d96c; --mist:#c4a8f5; --coin:#ffcf6b; --hp:#7fd483; --pw:#f0a24e; --bad:#ff8a70;
  --display:'Sriracha','Itim','Leelawadee UI',Tahoma,sans-serif;
  --body:'Itim','Leelawadee UI','Noto Sans Thai',Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--soil);color:var(--ink);font:400 16px/1.42 var(--body);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#game{display:flex;flex-direction:column;gap:10px;max-width:1160px;margin:0 auto}
#screen{position:relative;width:min(100%,calc((100dvh - 350px)*4/3));min-width:min(100%,280px);max-width:100%;margin:0 auto;aspect-ratio:4/3;
  container-type:inline-size;border:3px solid var(--edge);box-shadow:0 0 0 2px #0c0805;background:#000;flex:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
canvas:focus-visible{outline:2px solid var(--sprout);outline-offset:2px}
#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;text-align:center;padding:6cqw;pointer-events:none}
#over:not(:empty){background:rgba(24,12,40,.5)}
#over h1{margin:0;font:400 12cqw/1.2 var(--display);color:var(--sprout);text-shadow:0 .6cqw 0 #23400f,0 0 6cqw rgba(196,168,245,.8)}
#over p{margin:0;font-size:max(14px,3.4cqw);max-width:80cqw;text-shadow:0 1px 0 #000,0 0 8px #000}
#panel{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.board{background:linear-gradient(180deg,var(--plank),var(--plank2));border:2px solid var(--edge);border-radius:3px;box-shadow:0 0 0 2px #0c0805,inset 0 0 0 1px var(--groove)}
#status{padding:8px 11px;display:grid;gap:4px}
#status:empty{display:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.row b{font-weight:400;color:var(--sprout);font-size:17px}
.row small{color:var(--dim);font-size:13px}
.bar{height:6px;background:#140d08;border:1px solid var(--groove)}
.bar i{display:block;height:100%;transition:width .25s}
.hp i{background:var(--hp)} .pw i{background:var(--pw)} .low i{background:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:4px;font-size:13px}
.tags:empty{display:none}
.tags span{padding:0 7px;border:1px solid var(--groove);border-radius:9px;background:rgba(0,0,0,.2)}
.tags .bad{border-color:var(--bad);color:var(--bad)}
.tags .set{border-color:var(--sprout);color:var(--sprout)}
#ctx{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-height:150px;min-width:0}
#who{color:var(--coin);font-size:14px}
#who:empty{display:none}
#msg{margin:0;min-height:1.42em;text-wrap:pretty}
#hint{margin:0;color:var(--dim);font-size:14px}
#hint:empty{display:none}
#savecode{width:100%;height:92px;resize:vertical;font:13px/1.35 ui-monospace,Consolas,monospace;color:var(--ink);background:#140d08;border:1px solid var(--groove);border-radius:3px;padding:6px;word-break:break-all}
#savecode:focus-visible{outline:2px solid var(--sprout)}
#seeds{display:flex;flex-wrap:wrap;gap:5px}
#seeds:empty{display:none}
#seeds button{all:unset;cursor:pointer;padding:3px 9px;border:1px solid var(--groove);border-radius:3px;font-size:14px;background:rgba(0,0,0,.18)}
#seeds button.on{border-color:var(--sprout);color:var(--sprout);background:rgba(164,217,108,.12)}
#seeds button:focus-visible{outline:2px solid var(--sprout)}
#menu{display:grid;gap:3px;overflow:auto;max-height:210px;padding:1px}
#menu:empty{display:none}
#menu button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px;padding:4px 10px 4px 22px;border-radius:3px;position:relative;min-width:0}
#menu button small{color:var(--dim);font-size:13px;text-align:right}
#menu button.sel{background:rgba(255,240,205,.14)}
#menu button.sel::before{content:"▸";position:absolute;left:7px;color:var(--coin)}
#menu button[aria-disabled=true]{color:#8d7c63;cursor:default}
#menu button:focus-visible{outline:2px solid var(--sprout)}
#foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:14px;color:var(--dim);padding-inline:3px;font-variant-numeric:tabular-nums}
#foot b{font-weight:400;color:var(--coin)}
#foot .m{color:var(--mist)}
#foot button{all:unset;cursor:pointer;padding:2px 8px;border:1px solid var(--groove);border-radius:3px}
#foot button:focus-visible{outline:2px solid var(--sprout)}
#pad{display:none;justify-content:space-between;align-items:center;gap:12px;padding:2px 6px;touch-action:none;user-select:none;-webkit-user-select:none}
#pad.show{display:flex}
#dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,40px);gap:3px}
#pad button{all:unset;display:grid;place-items:center;background:var(--plank2);border:2px solid var(--groove);border-radius:5px;touch-action:none;cursor:pointer}
#pad button:active{background:var(--groove)}
#ab{display:flex;gap:10px}
#ab button{width:68px;height:68px;border-radius:50%}
@media (pointer:fine) and (min-width:780px){#pad.show{display:none}}
@media (min-width:780px){
  #game{display:grid;grid-template-columns:minmax(0,1fr) 320px;align-items:start;gap:14px}
  #screen{width:min(100%,calc((100dvh - 30px)*4/3))}
  #menu{max-height:320px}
}
</style>

<main id="game">

<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'),c=cv.getContext('2d');
const T=16,W=320,H=240,TAU=Math.PI*2;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const CALM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Sound ---------- */
let ac=null,muted=false;
try{muted=localStorage.getItem('mg-mute')==='1'}catch(e){}
function tone(f,d=.08,type='square',v=.04,at=0){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+at;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={
  move(){tone(520,.04)},ok(){tone(760,.06)},back(){tone(300,.07)},
  plant(){tone(420,.06,'triangle',.07);tone(560,.06,'triangle',.06,.05)},
  water(){[900,760,640].forEach((f,i)=>tone(f,.06,'sine',.05,i*.04))},
  harvest(){[600,800,1000].forEach((f,i)=>tone(f,.08,'triangle',.07,i*.05))},
  coin(){[880,1320].forEach((f,i)=>tone(f,.08,'square',.04,i*.07))},
  hit(){tone(140,.12,'sawtooth',.07)},crit(){tone(120,.2,'sawtooth',.09);tone(90,.2,'square',.05,.04)},
  miss(){tone(240,.1,'sine',.04)},heal(){[620,830,1040].forEach((f,i)=>tone(f,.14,'sine',.07,i*.07))},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.05,i*.12))},
  enc(){[220,180,140,110].forEach((f,i)=>tone(f,.12,'sawtooth',.07,i*.08))},
  boom(){tone(70,.5,'sawtooth',.12);tone(50,.5,'square',.08,.05)},
};

/* ---------- Game data ---------- */
const CROPS={
  carrot:{name:'แครอท',unit:'หัว',base:1,extra:[[3,.05],[2,.20]],seed:5,sell:12,days:2,eat:10,
    fact:'แครอทมีเบตาแคโรทีน ร่างกายเปลี่ยนเป็นวิตามิน A ซึ่งจำเป็นต่อการมองเห็น',
    power:'ตาไว',set2:'โอกาสคริติคอล +15%',set3:'ตีไม่พลาด และคริติคอลแรงขึ้น'},
  tomato:{name:'มะเขือเทศ',unit:'ผล',base:3,extra:[[6,.05],[5,.20],[4,.35]],seed:12,sell:10,days:3,eat:6,
    fact:'มะเขือเทศมีวิตามิน C ซึ่งร่างกายใช้สร้างคอลลาเจนและสมานแผล',
    power:'แผลหายไว',set2:'ฟื้น HP 2 ทุกเทิร์น',set3:'ฟื้น HP 4 ทุกเทิร์น'},
  pumpkin:{name:'ฟักทอง',unit:'ลูก',base:1,extra:[[3,.02],[2,.10]],seed:25,sell:70,days:4,eat:35,
    fact:'ฟักทองมีเบตาแคโรทีนและวิตามิน C ซึ่งมีส่วนช่วยระบบภูมิคุ้มกัน',
    power:'ภูมิคุ้มกันดี',set2:'ลดโอกาสติดสถานะ 50%',set3:'กันสถานะผิดปกติทั้งหมด'},
};
const CROP_IDS=['carrot','tomato','pumpkin'];
const SLOTS=['weapon','hat','shirt'];
const SLOT_NAME={weapon:'อาวุธ',hat:'หมวก',shirt:'เสื้อ'};
const GEAR={
  carrot:{weapon:['ดาบแครอท',3],hat:['หมวกใบแครอท',6],shirt:['เสื้อแครอท',2],cloth:'#e8862e'},
  tomato:{weapon:['ค้อนมะเขือเทศ',4],hat:['หมวกมะเขือเทศ',9],shirt:['เสื้อมะเขือเทศ',3],cloth:'#cf3f3a'},
  pumpkin:{weapon:['กระบองฟักทอง',5],hat:['หมวกฟักทอง',12],shirt:['เกราะฟักทอง',4],cloth:'#b9742a'},
};
const itemId=(crop,slot)=>crop+'_'+slot;
const itemCrop=id=>id.split('_')[0];
const itemSlot=id=>id.split('_')[1];
const itemName=id=>GEAR[itemCrop(id)][itemSlot(id)][0];
const MONSTERS={
  carrot:{name:'แครอทคลั่ง',hp:22,atk:7,def:1,spd:9,xp:8,gold:12},
  tomato:{name:'มะเขือเทศระเบิด',hp:20,atk:8,def:1,spd:5,xp:14,gold:28},
  pumpkin:{name:'ฟักทองยักษ์',hp:55,atk:11,def:4,spd:3,xp:30,gold:60},
};
const FRUITS={
  carrot:{name:'ผลปีศาจแครอท',skill:'ตาเหยี่ยว',pw:4,note:'ตีแรง 1.4 เท่า คริติคอลแน่นอน'},
  tomato:{name:'ผลปีศาจมะเขือเทศ',skill:'ระเบิดฉ่ำ',pw:5,note:'ตีแรง 3 เท่า เสีย HP 10%'},
  pumpkin:{name:'ผลปีศาจฟักทอง',skill:'เปลือกเหล็ก',pw:4,note:'ป้องกันและสะท้อน 1.5 เท่าของการโจมตีครั้งถัดไป'},
};
const SPR={
  carrot:{pal:{k:'#3a1a08',o:'#f28a2c',d:'#c9651a',l:'#ffb45e',g:'#3fa34d',h:'#2a7a3a',w:'#ffffff',e:'#1a0a04'},gold:{o:'#ffd34a',d:'#c99a1f',l:'#fff0a0',g:'#c4a8f5',h:'#8d6fd0'},rows:[
    ".....g..g..g....","......g.g.g.....","......gghgg.....",".......ggg......",".....kkkkkk.....","....kooooook....","....kloooodk....","....koweoweok...","....koooooodk...","....kookkkodk...",".....koooodk....",".....kloodk.....","......koodk.....","......kodk......",".......kk......."]},
  tomato:{pal:{k:'#3a0a0a',r:'#d9413f',d:'#a52d2c',l:'#ff8a7a',g:'#3fa34d',w:'#ffffff',e:'#1a0505'},gold:{r:'#ffd34a',d:'#c99a1f',l:'#fff0a0',g:'#c4a8f5'},rows:[
    "......g.gg......",".....ggggg......","....kkggggkk....","..kkrrrggrrrkk..",".krrlrrrrrrrrrk.",".krlrrrrrrrrrdk.","krrrwerrrrwerrdk","krrrrrrrrrrrrrdk","krrkwkwkwkwkrrdk","krrrkwkwkwkrrrdk",".krrrkkkkkrrrdk.",".krrrrrrrrrrddk.","..kkdddddddkk...","....kkkkkkkk...."]},
  pumpkin:{pal:{k:'#2e1505',o:'#e88a2a',d:'#b5621a',y:'#ffe15c',h:'#3f8a3a'},gold:{o:'#ffd34a',d:'#c99a1f',h:'#c4a8f5',y:'#ffffff'},rows:[
    ".......hh.......","......hhh.......","...kkkkhhkkkk...","..koodooodoook..",".koodoooodooodk.",".kodoooooooodok.","koodkkooookkdook","koodkykoookykdok","koodoooooooodok.","kodookokokokodok","koodookkkkkkodok",".koodoooooodook.","..kkddddddddkk..","....kkkkkkkk...."]},
};
const MAP=[
"TTTTTTTTTTTTTTTTTTTT",
"T.RRRRR.....aaaa...T",
"T.RRRRR.....aaaa...T",
"T.WWDWW.....cccc...T",
"T...,........,,....T",
"T...,,,,,,,,,,,....T",
"T..................T",
"T..................T",
"T.............b....T",
"T..o...............T",
"T..................T",
"T..................T",
"T~~~~..........MM..T",
"T~~~~..........MM..T",
"TTTTTTTTTTTTTTTTTTTT"];
const SOLID='TRWDacbo~M';
const PX=6,PY=6;

/* ---------- State ---------- */
let G=null,mode='title',fade=0,time=0,shake=0;
const P={x:4,y:5,fx:4,fy:5,dir:'down',moving:false,t:0,path:null,then:null};
let fxMap=[],floatsMap=[];
function newGame(){
  const plots=[];for(let i=0;i<36;i++)plots.push({c:null,g:0,w:false});
  return {day:1,gold:40,shards:0,lv:1,xp:0,hp:40,pw:10,seeds:{carrot:6,tomato:0,pumpkin:0},veg:{carrot:0,tomato:0,pumpkin:0},
    items:{},equip:{weapon:null,hat:null,shirt:null},fruits:{carrot:0,tomato:0,pumpkin:0},power:null,plots,land:0,sickle:0,can:0,harvests:0,pity:0,sel:'carrot',
    seen:{carrot:{n:0,rare:0},tomato:{n:0,rare:0},pumpkin:{n:0,rare:0}},x:4,y:5};
}
const SAVE='mist-garden-save-v1';
function save(){try{localStorage.setItem(SAVE,JSON.stringify({...G,x:P.x,y:P.y}))}catch(e){}}
// A fight is not saved until it ends, so quitting mid-fight cannot lose the crop or keep damage.
let inFight=false;
let saveT=0;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{if(!inFight)save()},500)}
function flushSave(){clearTimeout(saveT);if(G&&!inFight)save()}
const BACKUPS=SAVE+'-backups',MAX_BACKUPS=3;
function loadBackups(){try{const l=JSON.parse(localStorage.getItem(BACKUPS));return Array.isArray(l)?l:[]}catch(e){return[]}}
function pushBackup(g){
  try{
    const copy=JSON.parse(JSON.stringify(g)),l=loadBackups().filter(b=>b.day!==copy.day);
    localStorage.setItem(BACKUPS,JSON.stringify([copy,...l].slice(0,MAX_BACKUPS)));
  }catch(e){}
}
function loadSave(){try{const s=localStorage.getItem(SAVE);return s?JSON.parse(s):null}catch(e){return null}}
const CODE_PREFIX='MG1-';
function exportCode(){return CODE_PREFIX+btoa(encodeURIComponent(JSON.stringify({...G,x:P.x,y:P.y})))}
function importCode(text){
  try{
    const t=text.replace(/\s+/g,'');if(!t.startsWith(CODE_PREFIX))return null;
    const o=JSON.parse(decodeURIComponent(atob(t.slice(CODE_PREFIX.length))));
    if(!Number.isFinite(o.day)||!Number.isFinite(o.lv)||!Number.isFinite(o.gold)||!Array.isArray(o.plots)||o.plots.length!==36)return null;
    const b=newGame(),g={...b,...o,seeds:{...b.seeds,...o.seeds},veg:{...b.veg,...o.veg},equip:{...b.equip,...o.equip},seen:{...b.seen,...o.seen},fruits:{...b.fruits,...o.fruits}};
    if(blocked(g.x,g.y)){g.x=b.x;g.y=b.y}
    return g;
  }catch(e){return null}
}
const mist=()=>Math.min(9,1+Math.floor((G.day-1)/7));
const landSize=()=>4+G.land;
const plotAt=(x,y)=>{const a=x-PX,b=y-PY;return a>=0&&b>=0&&a<6&&b<6?{i:b*6+a,a,b,unlocked:a<landSize()&&b<landSize()}:null};
function gearBonus(slot){const id=G.equip[slot];if(!id)return 0;const base=GEAR[itemCrop(id)][slot][1],lv=G.items[id]||1;return base+(lv-1)*(slot==='hat'?3:1)}
function setCount(crop){return SLOTS.filter(s=>G.equip[s]&&itemCrop(G.equip[s])===crop).length}
// Food always heals at least the weakest monster's current attack + 5, so eating stays worth a turn as mist rises.
const HEAL_BONUS=5;
const lowestAtk=()=>Math.min(...Object.values(MONSTERS).map(m=>m.atk))*(1+.15*(mist()-1));
const eatHeal=k=>Math.max(CROPS[k].eat,Math.round(lowestAtk())+HEAL_BONUS);
const maxHP=()=>40+(G.lv-1)*8+gearBonus('hat');
const maxPW=()=>10+(G.lv-1);
const atkOf=()=>6+(G.lv-1)*1.5+G.sickle*2+gearBonus('weapon');
const defOf=()=>3+(G.lv-1)*.8+gearBonus('shirt');
const xpNext=()=>Math.floor(15*G.lv**1.5);

/* ---------- Pixel art ---------- */
function mk(w,h){const e=document.createElement('canvas');e.width=w;e.height=h;return e}
function seeded(s){return ()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function tile(fn){const e=mk(T,T),g=e.getContext('2d');fn((x,y,w,h,k)=>{g.fillStyle=k;g.fillRect(x,y,w,h)});return e}
function speck(P,base,cols,n,seed){P(0,0,T,T,base);const r=seeded(seed);for(let i=0;i<n;i++)P(r()*T|0,r()*T|0,1,1,cols[r()*cols.length|0])}
const grass=P=>speck(P,'#4c8a52',['#437c49','#589a5e','#3c7042'],16,7);
const TILES={
  '.':tile(grass),
  ',':tile(P=>speck(P,'#b59a63',['#a48a55','#c4ab74','#94794a'],14,11)),
  'T':tile(P=>{grass(P);P(6,11,4,5,'#54351f');P(2,2,12,9,'#22643e');P(1,4,14,6,'#22643e');P(4,0,8,3,'#22643e');P(3,2,7,3,'#318452');P(5,1,4,2,'#42a067');P(10,7,3,2,'#1b5433')}),

function choose(items,o={}){
  return new Promise(res=>{
    const list=o.cancel?[...items,{label:'◂ กลับ',value:null}]:items;
    let sel=Math.max(0,list.findIndex(i=>!i.disabled));
    const box=$('#menu');box.innerHTML='';box.style.gridTemplateColumns=o.cols?`repeat(${o.cols},minmax(0,1fr))`:'';
    const paint=(s=true)=>{[...box.children].forEach((b,i)=>b.classList.toggle('sel',i===sel));if(s)box.children[sel]?.scrollIntoView({block:'nearest'})};
    const done=v=>{UI=null;box.innerHTML='';res(v)};
    const confirm=()=>{const it=list[sel];if(!it||it.disabled){sfx.back();return}sfx.ok();if(it.run)it.run();done(it.value)};
    list.forEach((it,i)=>{const b=document.createElement('button');b.type='button';
      b.innerHTML='<span></span>'+(it.sub?'<small></small>':'');b.firstChild.textContent=it.label;if(it.sub)b.lastChild.textContent=it.sub;
      if(it.disabled)b.setAttribute('aria-disabled','true');
      b.addEventListener('pointerenter',()=>{if(sel!==i&&!it.disabled){sel=i;paint(false)}});
      b.addEventListener('click',()=>{sel=i;confirm()});box.appendChild(b)});
    UI={move(dx,dy){const cols=o.cols||1,n=list.length;let s=sel;
        for(let k=0;k<n;k++){s=dy?(s+dy*cols+n*cols)%n:(s+dx+n)%n;if(!list[s].disabled)break}
        if(s!==sel){sel=s;sfx.move();paint()}},
      confirm,cancel(){if(o.cancel){sfx.back();done(null)}}};
    paint();

}

function harvest(p,x,y){
  const s=G.plots[p.i],kind=s.c;
  const safe=G.harvests<2;
  const chance=safe?0:Math.min(.45,.10+.015*(mist()-1)+G.pity*.015);
  G.harvests++;
  if(Math.random()<chance){
    G.pity=0;
    const rare=Math.random()<.1;
    return script(()=>encounter(p,kind,rare,x,y));
  }
  G.pity++;
  const n=rollYield(kind),unit=CROPS[kind].unit,bumper=n>CROPS[kind].base;
  s.c=null;s.g=0;s.w=false;G.veg[kind]+=n;
  sfx.harvest();burstMap(x,y,'#ffcf6b',Math.min(24,8*n));
  if(bumper)sfx.coin();
  if(n>1)floatsMap.push({x:x*T+8,y:y*T-2,n:'+'+n,t:0});
  note(`${bumper?'ผลดก! ':''}เก็บ${CROPS[kind].name}ได้ ${n} ${unit} รวมในกระเป๋า ${G.veg[kind]} ${unit}`);

}
async function encounter(p,kind,rare,x,y){

  setMsg(`${CROPS[kind].name}ต้นนี้ดิ้นอยู่ในดิน!`);

  const res=await battle(kind,rare);

  const near=[];

  F(0,0,W,H,'#6d5a92');F(0,30,W,30,'#7f6ba3');F(0,60,W,20,'#9483b3');

  F(0,92,W,148,'#6a4e32');for(let y=100;y<H;y+=14){F(0,y,W,2,'#5a4129');F(0,y+2,W,1,'#7c5c3a')}
  for(let i=0;i<220;i++)F(r()*W|0,92+r()*148|0,2,1,r()>.5?'#7c5c3a':'#533b25');
  for(let i=0;i<14;i++){const x=r()*W|0,y=100+r()*130|0;F(x,y,2,4,'#4fae56');F(x-2,y,2,2,'#4fae56');F(x+2,y-1,2,2,'#2f7f3e')}

}

  if(!sureCrit&&Math.random()>hit)return{miss:true};
  const crit=sureCrit||Math.random()<.08+(carrot>=2?.15:0);
  const d=(atkOf()*mult*rand(.92,1.08)-bt.e.def/2)*(crit?(carrot>=3?2:1.6):1);
  return{d,crit};

async function victory(e){

  if(up)await say(`เลเวลอัปเป็น Lv ${G.lv}! HP และพลังฟื้นเต็ม`);

  }else G.fruitMiss[e.kind]=fruitMissed+1;

  }
}

function findPath(tx,ty,adjacent){
  const k=(x,y)=>x+','+y,prev={[k(P.x,P.y)]:null},q=[[P.x,P.y]];
  const goal=adjacent?(x,y)=>Math.abs(x-tx)+Math.abs(y-ty)===1:(x,y)=>x===tx&&y===ty;
  while(q.length){
    const[x,y]=q.shift();
    if(goal(x,y)){const path=[];let cur=k(x,y);while(prev[cur]){path.unshift(prev[cur][1]);cur=prev[cur][0]}return path}
    for(const d in DIRS){const[a,b]=DIRS[d],nx=x+a,ny=y+b,nk=k(nx,ny);if(nk in prev||blocked(nx,ny))continue;prev[nk]=[k(x,y),d];q.push([nx,ny])}
  }
  return null;
}
function faceTo(x,y){const dx=x-P.x,dy=y-P.y;P.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}
function clickMap(x,y){
  if(mode!=='map'||!G)return;
  const interactive=plotAt(x,y)||blocked(x,y)&&describe(x,y);
  if(!interactive){const path=findPath(x,y,false);if(path){P.path=path;P.then=null}return}
  const path=findPath(x,y,true);if(!path)return;
  P.path=path;P.then=[x,y];
}
function update(dt){
  if(plotShake&&(plotShake.t-=dt)<=0)plotShake=null;
  if(mode!=='map'||!G)return;
  if(!P.moving){
    const d=held[held.length-1];
    if(d)P.path=null;
    if(P.path&&!P.path.length){const t=P.then;P.path=null;P.then=null;if(t){faceTo(t[0],t[1]);mapHint();act(t[0],t[1]);if(mode!=='map')return}}
    const nd=d||(P.path&&P.path.shift());
    if(nd){
      if(P.dir!==nd){P.dir=nd;mapHint()}
      const[dx,dy]=DIRS[nd],nx=P.x+dx,ny=P.y+dy;
      if(!blocked(nx,ny)){P.moving=true;P.t=0;P.fx=P.x;P.fy=P.y;P.x=nx;P.y=ny}else P.path=null;
    }
  }
  if(P.moving){
    P.t+=dt/.14;
    if(P.t>=1){P.moving=false;P.fx=P.x;P.fy=P.y;G.x=P.x;G.y=P.y;mapHint()}
  }
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  update(dt);
  c.imageSmoothingEnabled=false;
  shake=Math.max(0,shake-dt*10);
  c.save();if(shake>0&&!CALM)c.translate(Math.round(rand(-shake,shake)),0);
  if(bt)renderBattle(dt);else renderFarm();
  c.restore();
  if(fade>0){c.fillStyle=`rgba(0,0,0,${fade})`;c.fillRect(0,0,W,H)}
}
